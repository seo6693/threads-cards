name: Verify account tokens

on:
  push:
    branches: [main]
    paths: ["checks/request"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tokens (read-only, nothing is posted)
        env:
          THREADS_TOKEN_NUTRI: ${{ secrets.THREADS_TOKEN_NUTRI }}
          THREADS_TOKEN_DEALS: ${{ secrets.THREADS_TOKEN_DEALS }}
          THREADS_TOKEN_FRESH: ${{ secrets.THREADS_TOKEN_FRESH }}
          THREADS_TOKEN_PROMO: ${{ secrets.THREADS_TOKEN_PROMO }}
        run: python scripts/verify.py

      - name: Record result
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add checks/result.json
          git diff --cached --quiet || git commit -m "Record token check [skip ci]"
          git push
