name: Collect Threads insights (read-only)

on:
  push:
    branches: [main]
    paths: ["checks/insights-request"]
  schedule:
    - cron: "5 15 * * *"   # daily 00:05 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          THREADS_TOKEN_NUTRI: ${{ secrets.THREADS_TOKEN_NUTRI }}
          THREADS_TOKEN_DEALS: ${{ secrets.THREADS_TOKEN_DEALS }}
          THREADS_TOKEN_FRESH: ${{ secrets.THREADS_TOKEN_FRESH }}
          THREADS_TOKEN_PROMO: ${{ secrets.THREADS_TOKEN_PROMO }}
        run: python scripts/insights.py
      - name: Record
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add checks/insights.json
          git diff --cached --quiet || git commit -m "Record insights [skip ci]"
          git pull --rebase origin main && git push
