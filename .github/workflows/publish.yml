name: Publish Threads posts

on:
  push:
    branches: [main]
    paths: ["projects/**"]
  # Posts carry a random publish_after time; this picks them up when due.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish queued posts
        id: run
        continue-on-error: true
        env:
          THREADS_TOKEN_NUTRI: ${{ secrets.THREADS_TOKEN_NUTRI }}
          THREADS_TOKEN_DEALS: ${{ secrets.THREADS_TOKEN_DEALS }}
          THREADS_TOKEN_FRESH: ${{ secrets.THREADS_TOKEN_FRESH }}
          THREADS_TOKEN_PROMO: ${{ secrets.THREADS_TOKEN_PROMO }}
        run: python scripts/publish.py

      - name: Refresh dashboard status file
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_status.py

      - name: Record results
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add -A projects dashboard/status.json
          git diff --cached --quiet || git commit -m "Record publish results [skip ci]"
          git pull --rebase origin main && git push

      - name: Fail if any post failed
        if: steps.run.outcome == 'failure'
        run: exit 1
